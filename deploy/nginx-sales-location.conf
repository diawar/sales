# INCLUDE ONLY inside the existing sales.overclockers.kz HTTPS server block.
# Do not replace existing TLS settings or unrelated p1 vhosts.
# Resolve existing location conflicts before using this snippet.
location / {
    proxy_pass http://127.0.0.1:8173;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_redirect off;
    proxy_read_timeout 130s;
    client_max_body_size 10m;
    # Full paths may contain bearer tokens; don't inherit combined access logging.
    access_log off;
}
