<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — Рассылки</title><link rel="icon" href="/favicon.ico?v=5"><link rel="stylesheet" href="/auth.css"></head><body><main class="auth-card"><a class="auth-brand" href="/">Рассылки OVER</a><h1>Вход</h1><p>Войдите, чтобы работать с клиентами и рассылками.</p>{% if message %}<div class="auth-message" role="alert">{{ message }}</div>{% endif %}<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}">{{ form.as_p }}<button type="submit">Войти</button></form><p class="auth-muted">Рассылки работают в тестовом режиме. Отправка писем не включена.</p></main></body></html>
